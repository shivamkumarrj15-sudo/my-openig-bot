name: Instagram 4K Viral Quotes Auto-Poster

on:
  schedule:
    # 3 Times a day (UTC):
    # 1. 04:30 UTC = 10:00 AM IST (Morning: Life Reality & Lessons)
    # 2. 10:30 UTC = 04:00 PM IST (Afternoon: Silent Hustle & Motivation)
    # 3. 15:30 UTC = 09:00 PM IST (Night: Patience, Trust & Deep Healing)
    - cron: '30 4 * * *'
    - cron: '30 10 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch: # Manual 1-click test button

jobs:
  auto_post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Fonts for Hindi & 4K Rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-deva fonts-noto-extra || true

      - name: Install Dependencies
        run: |
          cd server
          npm install

      - name: Build Server
        run: |
          cd server
          npm run build

      - name: Execute 4K Quote AI Generator & Instagram Publisher
        run: |
          cd server
          node dist/core/ai/publish_cron.js
        env:
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID || '29180762911' }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME || 'shivamkumar12323229' }}
